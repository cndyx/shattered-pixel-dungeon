name: Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :android:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/build/outputs/apk/debug/android-debug.apk shattered-pixel-dungeon-debug.apk
          tag="debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf 'Debug APK built from commit %s.\n\nThis is a debug build.\n' "$GITHUB_SHA" > release-notes.txt
          gh release create "$tag" shattered-pixel-dungeon-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Debug APK #${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.txt \
            --latest
